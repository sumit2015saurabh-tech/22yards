<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a4a"/>
      <stop offset="50%" style="stop-color:#2d5a4a"/>
      <stop offset="100%" style="stop-color:#0b1318"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d6b4a"/>
      <stop offset="100%" style="stop-color:#3d9a7a"/>
    </linearGradient>
    <radialGradient id="lights" cx="50%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#d4b86a;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#d4b86a;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#sky)"/>
  <ellipse cx="960" cy="520" rx="900" ry="180" fill="url(#pitch)" opacity="0.9"/>
  <rect width="1920" height="600" fill="url(#lights)"/>
  <!-- Stadium lights -->
  <g fill="#d4b86a" opacity="0.6">
    <circle cx="200" cy="80" r="4"/><circle cx="400" cy="60" r="3"/><circle cx="600" cy="70" r="4"/>
    <circle cx="1320" cy="70" r="4"/><circle cx="1520" cy="60" r="3"/><circle cx="1720" cy="80" r="4"/>
  </g>
  <!-- Cricket pitch strip -->
  <rect x="860" y="380" width="200" height="140" fill="#c9a86c" opacity="0.25" rx="4"/>
  <!-- Stumps silhouette -->
  <g fill="#e8e0d0" opacity="0.7" transform="translate(930,420)">
    <rect x="0" y="0" width="6" height="50"/><rect x="20" y="0" width="6" height="50"/><rect x="40" y="0" width="6" height="50"/>
    <rect x="-2" y="0" width="50" height="6"/>
  </g>
  <text x="960" y="280" text-anchor="middle" fill="#d4b86a" font-size="48" font-family="system-ui,sans-serif" font-weight="700" opacity="0.15">22yards</text>
</svg>
